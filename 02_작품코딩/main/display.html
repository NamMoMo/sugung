<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>수궁야행 · 빔 화면</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* 빔 화면은 어떤 화면비에서도 정사각형으로: 짧은 변에 맞춘 정사각형을 가운데에 두고 나머지는 검게 비움.
     #stage 에 transform 이 있어서, 안의 position: fixed 요소들은 화면이 아니라 이 정사각형을 기준으로 놓임 */
  #stage { position: fixed; left: 50%; top: 50%; width: min(100vw, 100vh); height: min(100vw, 100vh);
    transform: translate(-50%, -50%); overflow: hidden; background: #050818; }
  body { cursor: none; }
  body.cursor { cursor: default; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #bannerHalo { position: fixed; left: 0; top: 0; width: 0; height: 0; pointer-events: none; opacity: 0;
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); background: rgba(10,14,40,.3);
    -webkit-mask-image: radial-gradient(closest-side, #000 35%, rgba(0,0,0,.6) 65%, transparent 100%);
            mask-image: radial-gradient(closest-side, #000 35%, rgba(0,0,0,.6) 65%, transparent 100%); }
  #status {
    position: fixed; right: calc(min(100vw, 100vh) * .012); bottom: calc(min(100vw, 100vh) * .012); font: 400 12px/1 "IBM Plex Sans KR", sans-serif;
    color: rgba(220,230,255,.35); display: flex; gap: .5em; align-items: center; pointer-events: none;
  }
  #status i { width: 7px; height: 7px; border-radius: 50%; background: #5ad19a; display: inline-block; }
  #status.off i { background: #d96a6a; }
  #help {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center;
    font: 400 16px/1.7 "IBM Plex Sans KR", sans-serif; color: #EFE7D3; background: rgba(8,12,34,.8);
    padding: 1.4em 2em; border-radius: 14px; transition: opacity .6s; pointer-events: none;
  }
  #help.hide { opacity: 0; }
</style>
</head>
<body>
<div id="stage">
<canvas id="sea"></canvas>
<div id="bannerHalo" aria-hidden="true"></div>   <!-- 하단 글씨 뒤: 바다만 살짝 흐리게 (초롱은 그 위 캔버스라 흐려지지 않음) -->
<canvas id="cv"></canvas>
<div id="help">화면을 한 번 누르면 전체 화면이 됩니다 · Click once for full screen<br><span style="opacity:.6;font-size:.85em">스마트폰에서 ‘이걸로 정할게요’를 누르면 그 청사초롱이 바다에서 떠오릅니다<br>When a visitor sends their chorong from their phone, it rises from the sea</span></div>
<div id="status"><i></i><span id="statusText">연결 중</span></div>
</div>
<script type="module">
import { CATEGORY, CAT_NAME, CAT_COLOR, ITEM_EN } from './catalog.js';   // ITEM_EN: 꼬리표·알림에 함께 쓰는 영어 이름
import * as THREE from './vendor/three/build/three.module.js';
import { twoToneFromName } from './colors.js';   // 관람객이 바꾼 위·아래 빛깔 ('쪽빛·다홍')
/* ───────────────────────── 설정 ───────────────────────── */
const params = new URLSearchParams(location.search);
const DEMO = params.has('demo');          // ?demo : 서버 없이 몇 초마다 시험용 초롱이 떠오름
const POLL_MS = 1500;   // 폰에서 초롱을 날리면 1~2초 안에 떠오르게
const MAX_LANTERNS = 7;                   // 가까이 머무는 초롱 수. 넘으면 가장 오래된 초롱부터 하나씩 먼 하늘로 물러나 작고 흐릿한 초롱이 되어 계속 떠 있음 (네임택 없이)
const TRANS_MS = 15000;                   // 가까운 초롱 → 먼 하늘의 흐릿한 초롱으로 물러나는 데 걸리는 시간 (천천히 떠가듯)
const FAR_MAX = 160;                      // 먼 하늘에 떠 있는 초롱 최대 수. 넘으면 가장 오래된 것부터 조용히 사라짐
const LEAVE_GAP_MS = 2000;                // 한 초롱이 별이 된 뒤, 다음 초롱이 떠나기까지 쉬는 시간
const WAIT_MAX = 3;                       // 차례를 기다릴 수 있는 초롱 수 (하늘 10칸 - 머무는 7개). 넘으면 가장 오래된 것은 제자리에서 조용히 흐려져 사라짐
const AGE_SHRINK = 0.3;                   // 가장 오래된 초롱이 새 초롱보다 작아지는 정도 (0 = 그대로 … 0.45 = 많이). 작을수록 오래된 꼬리표도 잘 보임
let HORIZON = 0.525;                      // 화면에서 수평선 높이 (화면 높이 비율). 화면 비율에 따라 bgMap() 이 다시 계산

// 체험 화면(index.html)의 여섯 빛깔과 같게
const PALETTES = {
  '청홍':   { shape: 'hex',    motif: 'plum',    animal: 'rabbit', top: '#2E4FC4', bottom: '#E8352C', glow: '255,178,122', frame: '#4A2C1E', trim: '#C9A04A' },
  '보랏빛': { shape: 'hex', motif: 'plum',   animal: 'rabbit', top: '#6B3FD0', bottom: '#F06AB0', glow: '247,166,224', frame: '#2E1A52', trim: '#E0B8F0' },
  '주황':   { shape: 'hex',    motif: 'plum',     animal: 'turtle', top: '#F7B43C', bottom: '#E6402A', glow: '255,176,96',  frame: '#6A2414', trim: '#E8B04A' },
  '쪽빛':   { shape: 'hex', motif: 'plum',   animal: 'turtle', top: '#2F76E0', bottom: '#F4F1FF', glow: '201,216,255', frame: '#152E66', trim: '#C8D6F0' },
  '자홍':   { shape: 'hex',    motif: 'plum', animal: 'rabbit', top: '#B43DD6', bottom: '#FF5E8A', glow: '255,154,200', frame: '#4A2C1E', trim: '#C9A04A' },
  '노을':   { shape: 'hex',    motif: 'plum',     animal: 'rabbit', top: '#FFD86A', bottom: '#F2732E', glow: '255,194,119', frame: '#4A2C1E', trim: '#C9A04A' },
};
const PAL_NAMES = Object.keys(PALETTES);
// 관람객이 꾸민 투톤 초롱('쪽빛·다홍')이면 그 색으로 초롱 정보를 만들어 PALETTES 에 더함
function ensurePalette(name) {
  if (PALETTES[name]) return true;
  const t = twoToneFromName(name); if (!t) return false;
  PALETTES[name] = { shape: 'hex', motif: 'plum', animal: 'rabbit', top: t.top, bottom: t.bottom, glow: t.glowRGB, frame: '#4A2C1E', trim: t.trim };
  return true;
}
// 이미 떠 있는 초롱의 색이 바뀌면(체험 화면에서 초롱을 날린 뒤 색을 바꾼 경우) 1.5초에 걸쳐 새 색으로 바뀜
const RECOLOR_MS = 1500;
function recolorLantern(e) {
  if (!ensurePalette(e.color)) return;
  const L = lanterns.find(o => o.k === e.k && !o.dead);
  if (!L || L.color === e.color) return;
  L.prevColor = L.color; L.color = e.color; L.recolorAt = performance.now();
}

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, dpr = 1;
const bg = new Image(); bg.src = './display-bg.jpg';

/* ───────────────────────── 청사초롱 그림 (빛깔마다 한 번만 그려 둠) ───────────────────────── */
const LW = 160, LH = 300;      // 초롱 그림 기준 크기 (본체 + 지붕 + 고리)
const spriteCache = {};
const PANEL_FRET = ["##############...##############..#########..###", "##############...##############..#########..###", "##############...##############..#########..###", "###........###...###........###..###...###..###", "###........###...###........###..###...###..###", "###........###...###........###..###...###..###", "###..####################...###..##############", "###..####################...###..##############", "###..####################...###..##############", "###..####..###...##...###...###........###", "###..###...###...##...###...###........###", "#########################...##############", "#########################...##############", "#########################...##############", ".....###...###...##", ".....###...###...##", ".....###...###...##", "###################", "###################", "###################", "###..###...###", "###..###...###", "###..#########", "###..#########", "###..#########", "###", "###", "###", "##############", "##############", "##############", "...........###", "...........###", "########...###", "#########..###", "#########..###", "###..####..###", "###...###..###", "###...###..###", "##############", "##############", "##############", "......###", "......###", "#########", "#########"];   // 초롱 면 귀퉁이 回자 무늬 (마무리 판 END_FRET_FULL 과 같은 무늬)
function latticeBorder(x, W, H) {
  // 테두리: 네 귀퉁이에 回자 무늬(마무리 판과 같은 무늬)를 바깥 가장자리에 붙이고, 무늬끼리 얇은 선으로 이음. 한지빛
  const F = PANEL_FRET, FW = W * 0.24, sc = FW / 47, FH = F.length * sc, IN = 10, col = 'rgba(255,248,236,.62)';
  x.fillStyle = col; x.strokeStyle = col; x.lineWidth = 2; x.lineCap = 'butt';
  const e = IN + 1; x.beginPath();
  x.moveTo(IN + FW, e); x.lineTo(W - IN - FW, e); x.moveTo(IN + FW, H - e); x.lineTo(W - IN - FW, H - e);
  x.moveTo(e, IN + FH); x.lineTo(e, H - IN - FH); x.moveTo(W - e, IN + FH); x.lineTo(W - e, H - IN - FH); x.stroke();
  for (const [cx, cy, sx, sy] of [[IN, IN, 1, 1], [W - IN, IN, -1, 1], [IN, H - IN, 1, -1], [W - IN, H - IN, -1, -1]]) {
    x.save(); x.translate(cx, cy); x.scale(sx, sy); x.beginPath();
    F.forEach((row, rr) => { for (let c = 0; c < row.length; c++) if (row[c] === '#') { let q = c; while (row[q + 1] === '#') q++; x.rect(c * sc, rr * sc, (q - c + 1) * sc + .3, sc + .3); c = q; } });
    x.fill(); x.restore();
  }
}
// 수궁 동물 실루엣 (토끼: 뛰어오르는 모습 / 거북: 헤엄치는 모습)
function animalPath(x, kind, cx, cy, s, flip = 1) {
  x.save(); x.translate(cx, cy); x.scale(flip * s, s); x.beginPath();
  if (kind === 'turtle') {
    x.ellipse(0, 0, 1, .72, 0, 0, Math.PI * 2);
    x.moveTo(1.5, 0); x.ellipse(1.22, -.02, .3, .22, 0, 0, Math.PI * 2);
    [[.55, -.72, -.6], [.55, .72, .6], [-.7, -.6, .5], [-.7, .6, -.5]].forEach(([fx, fy, r]) => { x.moveTo(fx + .45, fy); x.ellipse(fx, fy, .45, .16, r, 0, Math.PI * 2); });
    x.moveTo(-1.1, 0); x.ellipse(-1.12, 0, .16, .07, 0, 0, Math.PI * 2);
  } else {
    x.ellipse(0, 0, 1, .52, -.28, 0, Math.PI * 2);
    x.moveTo(1.3, -.5); x.arc(.95, -.5, .36, 0, Math.PI * 2);
    x.moveTo(.9, -1.0); x.ellipse(.78, -1.15, .13, .5, -.55, 0, Math.PI * 2);
    x.moveTo(1.1, -1.05); x.ellipse(.98, -1.18, .12, .46, -.3, 0, Math.PI * 2);
    x.moveTo(.95, .45); x.ellipse(.75, .45, .12, .42, .9, 0, Math.PI * 2);
    x.moveTo(-.6, .38); x.ellipse(-.95, .38, .2, .58, -1.05, 0, Math.PI * 2);
    x.moveTo(-.9, -.18); x.arc(-1.06, -.18, .17, 0, Math.PI * 2);
  }
  x.restore();
}
function drawAnimal(x, kind, cx, cy, s, flip, mode) {   // mode: 'shadow' 그림자 / 'glow' 빛나는 선
  animalPath(x, kind, cx, cy, s, flip);
  if (mode === 'glow') {
    x.save(); x.shadowColor = 'rgba(255,255,255,.95)'; x.shadowBlur = 14; x.lineWidth = 3; x.strokeStyle = 'rgba(255,255,255,.95)'; x.fillStyle = 'rgba(255,255,255,.18)';
    x.fill(); x.stroke(); x.restore();
    if (kind === 'turtle') { x.save(); x.strokeStyle = 'rgba(255,255,255,.7)'; x.lineWidth = 1.6; x.translate(cx, cy); x.scale(flip * s, s);
      x.beginPath(); for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3; x.lineTo(Math.cos(a) * .42, Math.sin(a) * .32); } x.closePath(); x.restore(); x.stroke(); }
  } else { x.fillStyle = 'rgba(40,30,60,.62)'; x.fill(); }
}
// 물고기 비늘 무늬 (위·아래 띠)
function scaleBand(x, W, y0, y1, col, sz) {
  x.save(); x.beginPath(); x.rect(0, y0, W, y1 - y0); x.clip();
  for (let r = 0, y = y0 - sz; y < y1 + sz; r++, y += sz * .55) {
    for (let cx = (r % 2) * sz - sz; cx < W + sz; cx += sz * 2) {
      const g = x.createRadialGradient(cx, y + sz * .9, 1, cx, y + sz * .5, sz * 1.1);
      g.addColorStop(0, 'rgba(255,255,255,.55)'); g.addColorStop(.6, col); g.addColorStop(1, col);
      x.fillStyle = g; x.beginPath(); x.arc(cx, y + sz, sz, Math.PI, 0); x.lineTo(cx + sz, y + sz * 1.6); x.lineTo(cx - sz, y + sz * 1.6); x.closePath(); x.fill();
      x.strokeStyle = 'rgba(255,240,210,.75)'; x.lineWidth = 1.6; x.beginPath(); x.arc(cx, y + sz, sz, Math.PI, 0); x.stroke();
    }
  }
  x.restore();
}
function waveLines(x, W, y, amp, col, n = 3) {
  x.strokeStyle = col; x.lineCap = 'round';
  for (let k = 0; k < n; k++) {
    x.lineWidth = 3 - k * .7; x.beginPath();
    for (let px = 0; px <= W; px += 6) { const py = y + k * 14 + Math.sin(px / W * Math.PI * 4 + k) * amp; px ? x.lineTo(px, py) : x.moveTo(px, py); }
    x.stroke();
  }
  // 말린 물결 끝
  for (let px = W * .12; px < W; px += W * .25) { x.lineWidth = 2.2; x.beginPath(); x.arc(px, y - amp * .3, amp * .8, Math.PI * .2, Math.PI * 1.7); x.stroke(); }
}
function drawMotif(x, W, H, pal, motif, animal, rnd) {
  if (motif === 'scale') {                 // 둥근 비단 초롱: 위아래 비늘, 가운데 물결과 동물 그림자
    scaleBand(x, W, 0, H * .3, pal.top, 26);
    scaleBand(x, W, H * .7, H, pal.bottom, 26);
    const mid = x.createLinearGradient(0, H * .3, 0, H * .7);
    mid.addColorStop(0, 'rgba(255,250,240,.75)'); mid.addColorStop(.5, 'rgba(255,252,246,.55)'); mid.addColorStop(1, 'rgba(255,250,240,.75)');
    x.fillStyle = mid; x.fillRect(0, H * .3, W, H * .4);
    waveLines(x, W, H * .6, 10, 'rgba(255,255,255,.85)');
    x.strokeStyle = 'rgba(255,240,210,.9)'; x.lineWidth = 3; [H * .3, H * .7].forEach(y => { x.beginPath(); x.moveTo(0, y); x.lineTo(W, y); x.stroke(); });
    for (let k = 0; k < 4; k++) drawAnimal(x, animal, W * (.125 + k * .25), H * .47, Math.min(62, W * .07), k % 2 ? -1 : 1, 'shadow');   // 둘레 어디서 봐도 보이게 4마리
    for (let i = 0; i < 14; i++) { x.fillStyle = 'rgba(255,255,255,.6)'; x.beginPath(); x.arc(rnd() * W, H * (.33 + rnd() * .2), 2 + rnd() * 4, 0, 7); x.fill(); }
  } else if (motif === 'sea') {            // 네모 유리 초롱: 물속 빛줄기, 거품, 해초·산호, 빛나는 선으로 그린 동물
    x.save(); x.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 5; i++) { const sx = W * (.15 + rnd() * .7), g = x.createLinearGradient(sx, 0, sx + 60, H * .6);
      g.addColorStop(0, 'rgba(255,255,255,.28)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g;
      x.beginPath(); x.moveTo(sx - 10, 0); x.lineTo(sx + 14, 0); x.lineTo(sx + 90, H * .6); x.lineTo(sx + 40, H * .6); x.closePath(); x.fill(); }
    x.restore();
    for (let i = 0; i < 26; i++) { const r = 2 + rnd() * 9; x.strokeStyle = 'rgba(255,255,255,.75)'; x.lineWidth = 1.4; x.beginPath(); x.arc(rnd() * W, H * (.08 + rnd() * .55), r, 0, 7); x.stroke(); }
    x.save(); x.shadowColor = 'rgba(190,255,235,.9)'; x.shadowBlur = 10; x.lineCap = 'round';
    for (let i = 0; i < 7; i++) { const sx = W * (.05 + i * .15 + rnd() * .05), hh = H * (.18 + rnd() * .2);
      x.strokeStyle = `rgba(${160 + rnd() * 60},255,${210 + rnd() * 40},.85)`; x.lineWidth = 4 + rnd() * 4;
      x.beginPath(); x.moveTo(sx, H); x.bezierCurveTo(sx + 24, H - hh * .35, sx - 24, H - hh * .7, sx + 8, H - hh); x.stroke(); }
    for (let i = 0; i < 3; i++) { const cx = W * (.2 + i * .3), cy = H * .94; x.strokeStyle = 'rgba(255,220,235,.85)'; x.lineWidth = 3;
      [[-.6, 60], [0, 80], [.6, 55]].forEach(([a, l]) => { x.beginPath(); x.moveTo(cx, cy); x.lineTo(cx + Math.sin(a) * l, cy - Math.cos(a) * l); x.stroke(); }); }
    x.restore();
    waveLines(x, W, H * .72, 12, 'rgba(255,255,255,.55)', 2);
    drawAnimal(x, animal, W * .5, H * .44, Math.min(W, 420) * .2, 1, 'glow');
  }
}
function drawLattice(x, W, H, pal, animal) {  // 꽃살창 + 둥근 달창 속 동물 그림자
  const r = Math.min(W, H) * .3, cy = H * .38;
  const g = x.createRadialGradient(W / 2, cy, 4, W / 2, cy, r);
  g.addColorStop(0, 'rgba(255,253,245,.95)'); g.addColorStop(.85, 'rgba(255,246,228,.75)'); g.addColorStop(1, 'rgba(255,246,228,0)');
  x.fillStyle = g; x.beginPath(); x.arc(W / 2, cy, r, 0, 7); x.fill();
  drawAnimal(x, animal, W / 2, cy + r * .1, r * .32, 1, 'shadow');
  x.strokeStyle = 'rgba(255,244,226,.7)'; x.lineWidth = 2;
  const step = W / 8;
  for (let px = step; px < W; px += step) { x.beginPath(); x.moveTo(px, H * .74); x.lineTo(px, H - 20); x.stroke(); }
  for (let py = H * .74; py < H - 20; py += step) { x.beginPath(); x.moveTo(20, py); x.lineTo(W - 20, py); x.stroke(); }
  x.lineWidth = 3; x.beginPath(); x.arc(W / 2, cy, r * 1.02, 0, 7); x.stroke();
  latticeBorder(x, W, H);
}
// 창(한지) 그림: 체험 화면 초롱과 같은 무늬
function panelCanvas(p, W, H, seed) {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  let r = seed * 9301 + 49297; const rnd = () => ((r = (r * 9301 + 49297) % 233280) / 233280);
  let g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, p.top); g.addColorStop(.36, p.top); g.addColorStop(.62, p.bottom); g.addColorStop(1, p.bottom);
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  g = x.createRadialGradient(W / 2, H * .55, 6, W / 2, H * .55, W * .8);
  g.addColorStop(0, 'rgba(255,250,235,.7)'); g.addColorStop(.5, 'rgba(255,240,220,.2)'); g.addColorStop(1, 'rgba(255,240,220,0)');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  if (p.motif === 'scale' || p.motif === 'sea') { drawMotif(x, W, H, p, p.motif, p.animal, rnd); return c; }
  if (p.motif === 'lattice') drawLattice(x, W, H, p, p.animal);
  // 매화 가지

    const cg = ctx.createLinearGradient(hx, hy, hx - dx * L * 0.5, hy - dy * L * 0.5);   // 가운데 밝은 심
    cg.addColorStop(0, `rgba(255,255,255,${0.9 * fade})`); cg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = cg; ctx.lineWidth = 0.8 * u * m.w;
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx - dx * L * 0.5, hy - dy * L * 0.5); ctx.stroke();
    // 머리: 진행 방향으로 길쭉한 푸르스름한 빛 + 흰 심지
    ctx.globalAlpha = fade;
    ctx.translate(hx, hy); ctx.rotate(m.ang);
    ctx.scale(2.6, 1);
    const hg = ctx.createRadialGradient(0, 0, 0, 0, 0, 7 * u * m.w);
    hg.addColorStop(0, 'rgba(255,255,255,1)'); hg.addColorStop(0.35, 'rgba(200,215,255,.7)'); hg.addColorStop(1, 'rgba(150,170,255,0)');
    ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(0, 0, 7 * u * m.w, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function frame(now) {
  drawBg(now);
  drawSkyExtras(now);   // 초롱보다 뒤(먼 하늘)에 그림
  drawFarLanterns(now); // 먼 하늘로 물러난 흐릿한 초롱들
  const gapMs = now - (frame.last || now);
  const dt = Math.min(0.1, gapMs / 1000); frame.last = now;
  // 화면이 한동안 멈췄다 돌아온 경우(다른 탭·창 가림·절전): 그사이 밀린 초롱이 한꺼번에 움직이지 않게,
  // 가장 새로운 것들만 남기고 나머지는 보이지 않는 사이에 조용히 정리
  if (gapMs > 3000) {
    const kept = lanterns.filter(L => !L.leaveAt && !L.fadeAt).sort((a, b) => b.born - a.born);
    kept.slice(MAX_LANTERNS).forEach(L => { const sp = pickFarSpot(); L.far = { x: sp.x, y: sp.y, ...farLook() }; toFar(L, now); lanterns.splice(lanterns.indexOf(L), 1); });   // 보이지 않던 사이 밀린 초롱은 바로 먼 하늘로
    kept.slice(0, MAX_LANTERNS).forEach((L, rank) => { L.depth = rank / MAX_LANTERNS; });
    nextLeaveAt = now + LEAVE_GAP_MS * 2;
  }
  // 새로 온 순서(rank). 하늘에 머무는 것은 MAX_LANTERNS 개까지, 그보다 오래된 초롱은 제자리에서 차례를 기다림
  const staying = lanterns.filter(L => !L.leaveAt && !L.fadeAt).sort((a, b) => b.born - a.born);
  staying.forEach((L, rank) => {
    const target = Math.min(rank, MAX_LANTERNS - 1) / MAX_LANTERNS;
    L.depth += (target - L.depth) * (1 - Math.exp(-dt * 0.8));
  });
  // 너무 많이 밀리면(시험용 빠른 모드 등) 가장 오래된 것부터 제자리에서 흐려짐
  while (staying.length > MAX_LANTERNS + WAIT_MAX) { const L = staying.pop(); L.trans = TRANS_MS * 0.4; L.leaveAt = now; L.leaveFrom = null; }   // 너무 많이 밀리면 기다리지 않고 바로 먼 하늘로
  // 하나씩 천천히: 별이 되러 떠나는 초롱은 한 번에 하나. 앞의 초롱이 별이 되고 잠깐 쉰 뒤에 다음 초롱이 출발
  // (기다리는 초롱이 2개 이상 쌓이면 조금씩 빨리 떠나서 하늘이 너무 붐비지 않게 함)
  const waiting = staying.length - MAX_LANTERNS;
  if (waiting > 0 && now >= nextLeaveAt && !lanterns.some(L => L.leaveAt && !L.dead)) {
    const L = staying[staying.length - 1];                                   // 가장 오래된 초롱
    const hurry = Math.max(0.5, 1 - (waiting - 1) * 0.25);                   // 1 = 평소 빠르기(기다리는 초롱 1개) … 0.5 = 3개가 기다릴 때
    const P = lanternPose(L, now);
    L.trans = TRANS_MS * hurry; L.leaveAt = now; L.leaveFrom = null;
    nextLeaveAt = now + L.trans + LEAVE_GAP_MS * hurry;
  }
  lanterns.forEach(L => {
    if (L.leaveAt && !L.dead && now - L.leaveAt >= (L.trans || TRANS_MS)) { L.dead = true; toFar(L, now); }   // 별 대신 먼 하늘의 초롱으로
    if (L.fadeAt && now - L.fadeAt >= FADE_MS) L.dead = true;
  });
  lanterns.sort((a, b) => (b.depth + (b.leaveAt ? 1 : 0)) - (a.depth + (a.leaveAt ? 1 : 0)));   // 먼 것부터 그림
  lanterns.forEach(L => drawLantern(L, now));
  for (let i = lanterns.length - 1; i >= 0; i--) if (lanterns[i].dead) lanterns.splice(i, 1);
  drawBanner(now); drawCount();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ───────────────────────── 서버에서 새 초롱 받기 ───────────────────────── */
const st = document.getElementById('status'), stText = document.getElementById('statusText');
let first = true;
async function poll() {
  try {
    const res = await fetch(`./api/feed?after=${first ? 0 : lastAt}&t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok || !(res.headers.get('content-type') || '').includes('json')) throw new Error(res.status);
    const { items } = await res.json();
    items.sort((a, b) => a.at - b.at);
    // 처음 열었을 때는 초롱 없이 빈 하늘로 시작: 이미 띄운 기록은 건너뛰고, 화면을 연 뒤에 새로 들어온 것만 띄움
    if (first) items.forEach(e => seen.add(e.k));
    else {
      items.filter(e => seen.has(e.k) && e.recolor).forEach(recolorLantern);   // 색만 바뀐 초롱
      items.filter(e => !seen.has(e.k)).forEach((e, i) => setTimeout(() => addLantern(e, true), i * 2500));   // 여러 개가 한꺼번에 오면 차례로
    }   // 여러 개가 한꺼번에 오면 차례로
    items.forEach(e => { lastAt = Math.max(lastAt, e.at); });
    first = false; st.classList.remove('off'); stText.textContent = '연결됨';
  } catch (e) { st.classList.add('off'); stText.textContent = '연결 끊김 · 다시 시도 중'; }
  setTimeout(poll, POLL_MS);
}
if (DEMO) {

  let n = 1; stText.textContent = '시험 모드';
  const go = () => { addLantern({ k: 'demo' + n, id: String(n).padStart(4, '0'), item: items[n % items.length], color: PAL_NAMES[n % 6], at: Date.now() }, true); n++; };
  // 평소 시험: 처음 MAX_LANTERNS 개는 6초마다 떠올라 하늘을 채우고, 그 뒤로는 20초마다 하나씩 (하나씩 천천히 별이 되는 모습을 보기 위해)
  // ?demo&fast: 2.5초마다 계속 (한꺼번에 몰릴 때를 시험)
  const FAST = params.has('fast');
  const tick = () => { go(); setTimeout(tick, FAST ? 2500 : (n <= MAX_LANTERNS ? 6000 : 20000)); };
  tick();
} else poll();
